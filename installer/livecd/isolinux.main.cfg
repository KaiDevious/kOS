UI vesamenu.c32
TIMEOUT 50
DEFAULT live

MENU BACKGROUND splash.png
MENU TITLE kOS
MENU ROW 12
MENU MARGIN 18
MENU ROWS 5
MENU TABMSGROW 20
MENU CMDLINEROW 20
MENU TIMEOUTROW 22
MENU HELPMSGROW 20

MENU COLOR title       1;36;40  #ff86c8ff #00000000 std
MENU COLOR sel         7;37;40  #ffffffff #ff2c62cf std
MENU COLOR unsel       37;40    #ffc8d2e0 #00000000 std
MENU COLOR border      30;40    #00000000 #00000000 std
MENU COLOR timeout_msg 37;40    #ff8694a6 #00000000 std
MENU COLOR timeout     1;37;40  #ffffffff #00000000 std
MENU COLOR tabmsg      37;40    #ff5c6878 #00000000 std

LABEL live
    MENU LABEL Start kOS
    LINUX {{{vmlinuz}}}
    APPEND {{{kernel_parameters}}} audit=0 splash quiet loglevel=3 systemd.show_status=auto udev.log_priority=3
    INITRD {{{initrdImg}}}

LABEL ram
    MENU LABEL Start kOS (load into RAM)
    LINUX {{{vmlinuz}}}
    APPEND {{{kernel_parameters}}} audit=0 splash quiet loglevel=3 systemd.show_status=auto udev.log_priority=3 toram
    INITRD {{{initrdImg}}}

LABEL safe
    MENU LABEL Start kOS (safe graphics)
    LINUX {{{vmlinuz}}}
    APPEND {{{kernel_parameters}}} nomodeset
    INITRD {{{initrdImg}}}
