set timeout=5
set default=0

insmod efi_gop
insmod efi_uga
insmod all_video
insmod gfxterm
insmod png
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

search --no-floppy --set=root --label OA_LIVE

if loadfont /boot/grub/font.pf2; then
    set gfxmode=auto
    terminal_output gfxterm
fi

background_image /boot/grub/splash.png
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue
set color_normal=light-gray/black
set color_highlight=white/blue

menuentry "Start kOS" {
    linux {{{vmlinuz}}} {{{kernel_parameters}}} audit=0 splash quiet loglevel=3 systemd.show_status=auto udev.log_priority=3
    initrd {{{initrdImg}}}
}
menuentry "Start kOS (load into RAM)" {
    linux {{{vmlinuz}}} {{{kernel_parameters}}} audit=0 splash quiet loglevel=3 systemd.show_status=auto udev.log_priority=3 toram
    initrd {{{initrdImg}}}
}
menuentry "Start kOS (safe graphics)" {
    linux {{{vmlinuz}}} {{{kernel_parameters}}} nomodeset
    initrd {{{initrdImg}}}
}
